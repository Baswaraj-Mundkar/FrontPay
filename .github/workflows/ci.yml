name: FrontPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check src/script.js

      - name: Run ESLint
        run: npm run lint

      - name: Run smoke tests
        run: npm test

      - name: Validate local asset references
        run: npm run validate

      - name: Check documentation formatting
        run: npm run format:check

      - name: Enforce Conventional Commits on pull requests
        if: github.event_name == 'pull_request'
        run: npx --yes --package @commitlint/cli@19.8.1 --package @commitlint/config-conventional@19.8.1 commitlint --extends @commitlint/config-conventional --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
